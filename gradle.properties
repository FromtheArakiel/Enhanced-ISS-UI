irons_spellbooks_version=1.20.1-3.16.3
curios_version=5.14.1+1.20.1
geckolib_version=1.20.1-4.8.4
irons_lib_version=1.20.1-2.1.0
player_animation_version=1.0.2-rc1+1.20
