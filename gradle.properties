# Build JVM settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Toolchain (Minecraft 1.20.1 / Forge 47.x / official Mojang mappings)
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.2.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# Mod metadata
mod_id=freeissui
mod_name=Free ISS UI
mod_license=GPLv3
mod_version=2.1.0
mod_group_id=dev.arakiel.freeissui
mod_authors=FromtheArakiel
mod_description=A client side HUD rework for Iron's Spells 'n Spellbooks. The flat spell bar becomes a compact vertical spell deck, and the inscription table gets paging for long spell books.

